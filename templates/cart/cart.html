<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Cart</title>

<style>
body{
    font-family:'Segoe UI',sans-serif;
    background:#fff5f5;
    padding:30px;
}

/* Title */
.cart-title{
    color:#c8102e;
    margin-bottom:20px;
}

/* Table */
.cart-table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.cart-table th{
    background:#c8102e;
    color:#fff;
    padding:14px;
    text-align:left;
}

.cart-table td{
    padding:14px;
    border-bottom:1px solid #eee;
}

.cart-table tr:hover{
    background:#fff0f0;
}

/* Buttons */
.btn{
    border:none;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
    transition:.2s;
}

.btn-danger{
    background:#333;
    color:white;
}

.btn-danger:hover{
    background:black;
}

.btn-main{
    background:#c8102e;
    color:white;
}

.btn-main:hover{
    background:#a50d24;
    transform:scale(1.05);
}

/* Total */
.total-box{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    color:#c8102e;
}

/* Empty */
.empty-box{
    background:white;
    padding:40px;
    border-radius:12px;
    text-align:center;
    font-size:18px;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
}
</style>
</head>

<body>

<h2 class="cart-title">Your Cart</h2>

{% if items %}

<table class="cart-table">
<thead>
<tr>
<th>Item</th>
<th>Qty</th>
<th>Price</th>
<th>Subtotal</th>
<th></th>
</tr>
</thead>

<tbody>
{% for i in items %}
<tr id="row-{{ i.id }}">
<td>{{ i.item.name }}</td>

<td>
<strong>{{ i.quantity }}</strong>
</td>

<td>₹{{ i.item.price }}</td>

<td><strong>₹{{ i.subtotal }}</strong></td>

<td>
<button class="btn btn-danger" onclick="removeItem({{ i.id }})">✖</button>
</td>
</tr>
{% endfor %}
</tbody>
</table>


<div class="total-box">
Total: ₹ <span id="cart-total">{{ cart.total }}</span>
</div>

<br>

<button class="btn btn-main" onclick="clearCart()">🗑 Clear Cart</button>

{% else %}
<div class="empty-box">
🛒 Your cart is empty
</div>
{% endif %}


<script>
function getCookie(name){
let cookieValue=null;
if(document.cookie && document.cookie!==''){
let cookies=document.cookie.split(';');
for(let i=0;i<cookies.length;i++){
let cookie=cookies[i].trim();
if(cookie.substring(0,name.length+1)===(name+'=')){
cookieValue=decodeURIComponent(cookie.substring(name.length+1));
break;
}
}
}
return cookieValue;
}

const csrftoken = getCookie('csrftoken');


function removeItem(id){
fetch(`/cart/remove/${id}/`,{
method:"POST",
headers:{
"X-CSRFToken":csrftoken,
"Content-Type":"application/json"
}
})
.then(res=>res.json())
.then(data=>{
if(data.success){
document.getElementById(`row-${id}`).remove();
document.getElementById("cart-total").innerText=data.total;

if(data.count==0)
location.reload();
}
});
}


function clearCart(){
fetch(`/cart/clear/`,{
method:"POST",
headers:{
"X-CSRFToken":csrftoken,
"Content-Type":"application/json"
}
})
.then(res=>res.json())
.then(()=>location.reload());
}
</script>

</body>
</html>
