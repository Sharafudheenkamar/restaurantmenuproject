<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Analytics</title>
<style>body{font-family:Poppins,Arial;background:linear-gradient(135deg,#000,#b71c1c,#ff1744);color:#fff;margin:0;padding:20px}.card{max-width:780px;margin:auto;background:rgba(255,255,255,.1);padding:20px;border-radius:14px}a,button{padding:9px 12px;background:linear-gradient(45deg,#ff1744,#b71c1c);color:#fff;border:none;border-radius:8px;text-decoration:none}.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.stat{margin:8px 0}</style>
</head><body><div class="card"><h2>📊 Admin Analytics</h2>
<div class="top"><a href="{% url 'administrator:admin-dashboard' %}">⬅ Back</a><form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">{% csrf_token %}<button type="submit">Logout</button></form></div>
<div class="stat">Total Orders: {{ total_orders }}</div>
<div class="stat">Pending: {{ pending_orders }}</div>
<div class="stat">Preparing: {{ preparing_orders }}</div>
<div class="stat">Served: {{ completed_orders }}</div>
<div class="stat">Total Revenue: ₹{{ total_revenue }}</div>
<div class="stat">Last 7 Days Revenue: ₹{{ weekly_revenue }}</div>
<div class="stat">Total Feedbacks: {{ total_feedbacks }}</div>
</div></body></html>
