<h2>Admin Analytics</h2>
<!-- Top Action Buttons -->
<div style="margin-bottom:15px;">
    <!-- Back Button -->
    <a href="{% url 'administrator:menu-list' %}">
        <button type="button">⬅ Back</button>
    </a>

    <!-- Logout Button -->
    <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
</div>


<p>Total Orders: {{ total_orders }}</p>
<p>Pending: {{ pending_orders }}</p>
<p>Preparing: {{ preparing_orders }}</p>
<p>Completed: {{ completed_orders }}</p>

<p>Total Revenue: ₹{{ total_revenue }}</p>
<p>Last 7 Days Revenue: ₹{{ weekly_revenue }}</p>

<p>Total Feedbacks: {{ total_feedbacks }}</p>
