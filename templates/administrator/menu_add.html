<!DOCTYPE html>
<html>
<head>
<title>Add Menu Item</title>

<style>

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(-45deg,#1a0000,#330000,#000,#330000);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
    color:white;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.container{
    width:95%;
    max-width:550px;
    margin:70px auto;
    padding:35px;
    border-radius:20px;
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.06);
    box-shadow:0 0 40px rgba(255,0,0,.3);
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(40px)}
    to{opacity:1; transform:translateY(0)}
}

h2{
    text-align:center;
    margin-bottom:25px;
    text-shadow:0 0 12px red;
}

/* top buttons */
.top-bar{
    text-align:center;
    margin-bottom:25px;
}

.top-btn{
    padding:10px 18px;
    border:none;
    border-radius:10px;
    margin:5px;
    background:linear-gradient(45deg,#ff1744,#b71c1c);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.top-btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px red;
}

/* form */
form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

label{
    font-size:14px;
    color:#ffb3b3;
}

input,select{
    padding:12px;
    border-radius:10px;
    border:none;
    background:rgba(255,255,255,.15);
    color:white;
    font-size:15px;
}

input:focus,select:focus{
    outline:none;
    box-shadow:0 0 10px red;
}

/* checkbox */
.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:15px;
}

/* submit */
.submit-btn{
    margin-top:10px;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(45deg,#ff1744,#b71c1c);
    color:white;
    cursor:pointer;
    transition:.35s;
}

.submit-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px red;
}

</style>
</head>
<body>

<div class="container">

<h2>➕ Add Menu Item</h2>

<div class="top-bar">

<a href="{% url 'administrator:admin-menu' %}">
<button class="top-btn">⬅ Back</button>
</a>

<form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
{% csrf_token %}
<button class="top-btn">Logout</button>
</form>

</div>

<form method="post">
{% csrf_token %}

<label>Name</label>
<input type="text" name="name" placeholder="Enter item name">

<label>Price</label>
<input type="number" step="0.01" name="price" placeholder="Enter price">

<label>Category</label>
<select name="category">
{% for c in categories %}
<option value="{{ c.id }}">{{ c.name }}</option>
{% endfor %}
</select>

<label class="checkbox">
<input type="checkbox" name="available">
Available
</label>

<button class="submit-btn">Add Item</button>

</form>

</div>

</body>
</html>
