<h2>Menu</h2>
<!-- Top Action Buttons -->
<div style="margin-bottom:15px;">
    <!-- Back Button -->
    <a href="{% url 'administrator:menu-list' %}">
        <button type="button">⬅ Back</button>
    </a>

    <!-- Logout Button -->
    <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
</div>


<a href="{% url 'administrator:admin-menu-add' %}">Add Item</a>

<table border="1">
<tr>
<th>Name</th>
<th>Price</th>
<th>Actions</th>
</tr>

{% for item in object_list %}
<tr>
<td>{{ item.name }}</td>
<td>{{ item.price }}</td>
<td>
<a href="{% url 'administrator:admin-menu-edit' item.id %}">Edit</a>
<a href="{% url 'administrator:admin-menu-delete' item.id %}">Delete</a>
</td>
</tr>
{% endfor %}
</table>
