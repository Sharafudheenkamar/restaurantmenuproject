<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#000,#b71c1c,#ff1744);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* floating icons */
.food{
    position:fixed;
    width:70px;
    opacity:.9;
    animation: float 14s linear infinite;
    z-index:0;
}
.food:nth-child(1){ left:10%; animation-delay:0s;}
.food:nth-child(2){ left:80%; animation-delay:4s;}
.food:nth-child(3){ left:55%; animation-delay:8s;}
.food:nth-child(4){ left:30%; animation-delay:11s;}

@keyframes float{
    0%{top:110%; transform:rotate(0deg)}
    100%{top:-20%; transform:rotate(360deg)}
}

/* container */
.dashboard{
    max-width:900px;
    margin:60px auto;
    padding:30px;
    text-align:center;
    position:relative;
    z-index:1;
}

/* title */
.title{
    font-size:40px;
    font-weight:700;
    margin-bottom:30px;
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow{
    from{text-shadow:0 0 10px #fff,0 0 20px #ff1744;}
    to{text-shadow:0 0 25px #fff,0 0 50px #b71c1c;}
}

/* glass card grid */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

/* card buttons */
.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(16px);
    padding:30px 20px;
    border-radius:20px;
    text-decoration:none;
    color:white;
    font-size:18px;
    font-weight:600;
    transition:.35s;
    box-shadow:0 15px 40px rgba(0,0,0,.6);
}

.card:hover{
    transform:translateY(-10px) scale(1.03);
    background:rgba(255,255,255,0.15);
}

/* logout button */
.logout{
    margin-top:40px;
}

.logout button{
    padding:14px 30px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#ff1744,#b71c1c);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.logout button:hover{
    transform:scale(1.07);
    box-shadow:0 0 25px rgba(255,0,0,.8);
}

</style>
</head>
<body>

<!-- floating food icons -->
<img src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png" class="food">
<img src="https://cdn-icons-png.flaticon.com/512/5787/5787016.png" class="food">
<img src="https://cdn-icons-png.flaticon.com/512/135/135763.png" class="food">
<img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" class="food">


<div class="dashboard">

<div class="title">🍗 Admin Dashboard</div>

<div class="grid">

<a href="{% url 'administrator:admin-menu' %}" class="card">
🍔 Manage Menu
</a>

<a href="{% url 'administrator:admin-orders' %}" class="card">
📦 Orders
</a>

<a href="{% url 'administrator:admin-payments' %}" class="card">
💳 Payments
</a>

<a href="{% url 'administrator:admin-staff' %}" class="card">
👨‍🍳 Staff
</a>

<a href="{% url 'administrator:admin-analytics' %}" class="card">
📊 Analytics
</a>

<a href="{% url 'administrator:admin-tables' %}" class="card">
📱 Tables & QR
</a>

<a href="{% url 'administrator:category-list' %}" class="card">
📂 Categories
</a>

</div>


<div class="logout">
<form method="post" action="{% url 'accounts:logout' %}">
{% csrf_token %}
<button type="submit">Logout</button>
</form>
</div>

</div>

</body>
</html>
