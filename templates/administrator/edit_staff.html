<h2>Edit Staff</h2>
<!-- Top Action Buttons -->
<div style="margin-bottom:15px;">
    <!-- Back Button -->
    <a href="{% url 'administrator:admin-staff' %}">
        <button type="button">⬅ Back</button>
    </a>

    <!-- Logout Button -->
    <form method="post" action="{% url 'logout' %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
</div>


<form method="post">
{% csrf_token %}

<p>Username: {{ staff.username }}</p>

<label>Role</label>
<select name="role">
<option value="kitchen" {% if staff.role == "kitchen" %}selected{% endif %}>Kitchen</option>
<option value="admin" {% if staff.role == "admin" %}selected{% endif %}>Admin</option>
</select>

<br><br>
<button>Update</button>
</form>
