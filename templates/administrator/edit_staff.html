<!DOCTYPE html>
<html>
<head>
<title>Edit Staff</title>

<style>

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(-45deg,#1a0000,#330000,#000,#330000);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
    color:white;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.container{
    width:95%;
    max-width:520px;
    margin:80px auto;
    padding:35px;
    border-radius:20px;
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,0.06);
    box-shadow:0 0 40px rgba(255,0,0,.35);
    animation:fadeIn .9s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(40px)}
    to{opacity:1; transform:translateY(0)}
}

h2{
    text-align:center;
    margin-bottom:25px;
    text-shadow:0 0 12px red;
}

.top-bar{
    text-align:center;
    margin-bottom:25px;
}

.top-btn{
    padding:10px 18px;
    border:none;
    border-radius:10px;
    margin:5px;
    background:linear-gradient(45deg,#ff1744,#b71c1c);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.top-btn:hover{
    transform:scale(1.08);
    box-shadow:0 0 20px red;
}

form{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.error-box{
    padding:12px;
    border-radius:10px;
    background:rgba(255,23,68,.2);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
}

label{
    color:#ffb3b3;
}

select,input{
    padding:12px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,.15);
    color:white;
}

select option{
    background:#5a0f18;
    color:#fff;
}

select:focus,input:focus{
    outline:none;
    box-shadow:0 0 12px red;
}

.username-box{
    background:rgba(255,255,255,.1);
    padding:12px;
    border-radius:10px;
}

.submit-btn{
    margin-top:10px;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(45deg,#ff1744,#b71c1c);
    color:white;
    cursor:pointer;
    transition:.35s;
}

.submit-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px red;
}

</style>
</head>
<body>

<div class="container">

<h2>👤 Edit Staff</h2>

<div class="top-bar">

<a href="{% url 'administrator:admin-staff' %}">
<button class="top-btn">⬅ Back</button>
</a>

<form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
{% csrf_token %}
<button class="top-btn">Logout</button>
</form>

</div>

<form method="post">
{% csrf_token %}

<div class="username-box">
Username: <b>{{ staff.username }}</b>
</div>

<div class="username-box">
Role: <b>{{ staff.get_role_display }}</b>
</div>

{% if error_message %}
<div class="error-box">{{ error_message }}</div>
{% endif %}

<label>Email</label>
<input type="email" name="email" value="{{ form_data.email|default:staff.email }}" placeholder="Staff email">

<label>New Password</label>
<input type="password" name="password" placeholder="Leave blank to keep current password">

<button class="submit-btn">Update Staff</button>

</form>

</div>
</body>
</html>
