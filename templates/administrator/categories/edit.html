<!DOCTYPE html>
<html>
<head>
<title>Add Category</title>

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(-45deg,#1a0000,#330000,#000,#330000);
background-size:400% 400%;
animation:bgMove 10s ease infinite;
color:white;
}
@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.container{
max-width:500px;
margin:90px auto;
padding:35px;
border-radius:20px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(18px);
box-shadow:0 0 40px rgba(255,0,0,.35);
animation:fade .9s ease;
}
@keyframes fade{
from{opacity:0; transform:translateY(40px)}
to{opacity:1; transform:translateY(0)}
}

h2{text-align:center; text-shadow:0 0 15px red;}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:rgba(255,255,255,.15);
color:white;
margin-top:10px;
}
input:focus{
outline:none;
box-shadow:0 0 12px red;
}

.btn{
margin-top:20px;
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#ff1744,#b71c1c);
color:white;
font-weight:bold;
cursor:pointer;
transition:.3s;
}
.btn:hover{
transform:scale(1.05);
box-shadow:0 0 25px red;
}

.top{
text-align:center;
margin-bottom:20px;
}
.top a{
text-decoration:none;
color:white;
background:#ff1744;
padding:10px 18px;
border-radius:10px;
}
</style>
</head>
<body>

<div class="container">

<h2>➕ Add Category</h2>

<div class="top">
<a href="{% url 'administrator:category-list' %}">⬅ Back</a>
</div>

<form method="post">
{% csrf_token %}

<label>Name</label>
<input type="text" name="name" required>

<button class="btn">Save Category</button>

</form>
</div>
</body>
</html>
