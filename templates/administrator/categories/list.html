<h2>Categories</h2>

<a href="{% url 'administrator:admin-dashboard' %}">⬅ Dashboard</a>
<a href="{% url 'administrator:category-add' %}">➕ Add Category</a>

<hr>

<table border="1" cellpadding="8">
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Actions</th>
</tr>

{% for c in categories %}
<tr>
    <td>{{ c.id }}</td>
    <td>{{ c.name }}</td>
    <td>
        <a href="{% url 'administrator:category-edit' c.id %}">Edit</a>

        <form method="post"
              action="{% url 'administrator:category-delete' c.id %}"
              style="display:inline;">
            {% csrf_token %}
            <button type="submit">Delete</button>
        </form>
    </td>
</tr>
{% empty %}
<tr>
<td colspan="3">No categories created</td>
</tr>
{% endfor %}
</table>
