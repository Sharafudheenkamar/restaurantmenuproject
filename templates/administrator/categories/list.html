<!DOCTYPE html>
<html>
<head>
<title>Categories</title>

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(-45deg,#1a0000,#330000,#000,#330000);
background-size:400% 400%;
animation:bgMove 10s ease infinite;
color:white;
}
@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.container{
width:95%;
max-width:900px;
margin:60px auto;
}

h2{
text-align:center;
margin-bottom:25px;
text-shadow:0 0 15px red;
}

.topbar{
text-align:center;
margin-bottom:20px;
}
.topbar a{
text-decoration:none;
margin:5px;
padding:10px 18px;
border-radius:10px;
background:linear-gradient(45deg,#ff1744,#b71c1c);
color:white;
font-weight:bold;
}

table{
width:100%;
border-collapse:collapse;
background:rgba(255,255,255,.05);
backdrop-filter:blur(15px);
border-radius:12px;
overflow:hidden;
}

th,td{
padding:14px;
text-align:center;
}

th{
background:rgba(255,0,0,.3);
}

tr:hover{
background:rgba(255,255,255,.1);
}

.action-btn{
padding:7px 14px;
border-radius:8px;
text-decoration:none;
color:white;
background:#ff1744;
margin:3px;
display:inline-block;
}

.delete-btn{
background:#000;
}

.empty{
padding:25px;
font-size:18px;
}

</style>
</head>
<body>

<div class="container">

<h2>📂 Categories</h2>

<div class="topbar">
<a href="{% url 'administrator:admin-dashboard' %}">⬅ Dashboard</a>
<a href="{% url 'administrator:category-add' %}">➕ Add Category</a>
</div>

<table>
<tr>
<th>ID</th>
<th>Name</th>
<th>Actions</th>
</tr>

{% for c in categories %}
<tr>
<td>{{ c.id }}</td>
<td>{{ c.name }}</td>
<td>

<a href="{% url 'administrator:category-edit' c.id %}" class="action-btn">Edit</a>

<form method="post"
action="{% url 'administrator:category-delete' c.id %}"
style="display:inline;">
{% csrf_token %}
<button class="action-btn delete-btn">Delete</button>
</form>

</td>
</tr>

{% empty %}
<tr>
<td colspan="3" class="empty">No categories created</td>
</tr>
{% endfor %}

</table>

</div>
</body>
</html>
