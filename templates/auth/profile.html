{% extends "base.html" %}
{% block content %}

<div class="profile-card">
    <h2>Profile</h2>

    <p><strong>Username:</strong> {{ request.user.username }}</p>
    <p><strong>Email:</strong> {{ request.user.email }}</p>

    <a href="{% url 'accounts:logout' %}" class="logout-btn">Logout</a>
</div>

{% endblock %}
