<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#000,#b71c1c,#ff1744);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(460px,96%);background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:18px;padding:26px;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.title{text-align:center;font-size:28px;font-weight:700;margin:0 0 18px;text-shadow:0 0 14px rgba(255,255,255,.35)}
.help{margin:0 0 16px;color:#ffe3e3;text-align:center}
form p{margin:0 0 14px}
label{display:block;margin-bottom:6px;font-weight:600}
input{width:100%;padding:12px;border:none;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;box-sizing:border-box}
input:focus{outline:none;box-shadow:0 0 12px rgba(255,255,255,.35)}
ul.errorlist{margin:0 0 10px;padding-left:18px;color:#ffe3e3}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-block;padding:10px 16px;border:none;border-radius:10px;text-decoration:none;color:#fff;font-weight:600;background:linear-gradient(45deg,#ff1744,#b71c1c);cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <h2 class="title">Change Password</h2>
    <p class="help">Update your password with the same style as the customer menu pages.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <a href="{% url 'accounts:profile' %}" class="btn">Back to Dashboard</a>
        <button type="submit" class="btn">Update Password</button>
      </div>
    </form>
  </div>
</body>
</html>
