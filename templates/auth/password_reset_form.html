<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<style>body{font-family:Poppins,Arial;background:linear-gradient(135deg,#000,#b71c1c,#ff1744);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}.card{width:min(420px,92%);background:rgba(255,255,255,.1);padding:24px;border-radius:16px;backdrop-filter:blur(10px)}input{width:100%;padding:10px;border-radius:8px;border:none;margin:8px 0 12px}.btn{width:100%;padding:11px;border:none;border-radius:9px;background:linear-gradient(45deg,#ff1744,#b71c1c);color:#fff;font-weight:700}.link{display:block;margin-top:10px;color:#fff}</style>
</head>
<body>
  <form method="post" class="card">
    <h2>Reset Password</h2>
    <p>Enter your account email. We will email you a temporary password for login.</p>
    {% csrf_token %}
    {{ form.email.label_tag }}
    {{ form.email }}
    <button class="btn" type="submit">Send Reset Email</button>
    <a class="link" href="{% url 'accounts:login' %}">Back to login</a>
  </form>
</body>
</html>
