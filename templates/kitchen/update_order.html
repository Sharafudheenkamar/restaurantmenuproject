<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Order</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#000,#b71c1c,#ff1744);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(460px,100%);background:rgba(255,255,255,.1);backdrop-filter:blur(12px);padding:22px;border-radius:16px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
h2{margin:0 0 12px}
label{display:block;margin:8px 0 6px}
select,input{width:100%;padding:10px;border:none;border-radius:8px;margin-bottom:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 14px;border:none;border-radius:10px;text-decoration:none;color:#fff;font-weight:600;cursor:pointer;background:linear-gradient(45deg,#ff1744,#b71c1c)}
.btn.blue{background:linear-gradient(45deg,#3b82f6,#1d4ed8)}
</style>
</head>
<body>
  <div class="card">
    <h2>Update Order Status</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button type="submit" class="btn">Save</button>
        <a href="{% url 'kitchen-orders' %}" class="btn blue">Back to Kitchen</a>
      </div>
    </form>
  </div>
</body>
</html>
